<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="atoz-mark-title">
  <title id="atoz-mark-title">A To Z Exports emblem — golden wheat ear on deep forest green</title>
  <!-- Forest disc -->
  <circle cx="32" cy="32" r="28.5" fill="#173D2B"/>
  <!-- Inner hairline ring -->
  <circle cx="32" cy="32" r="24.5" fill="none" stroke="#C7A568" stroke-opacity="0.4" stroke-width="1"/>
  <!-- Wheat stem -->
  <path d="M32 47 V24" fill="none" stroke="#C7A568" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Grain pairs (left) -->
  <path d="M32 31 C27.5 31 25 28.5 24.5 23.5 C29 24 31.5 26.5 32 31 Z" fill="#C7A568"/>
  <path d="M32 36.5 C27.5 36.5 25 34 24.5 29 C29 29.5 31.5 32 32 36.5 Z" fill="#C7A568"/>
  <path d="M32 42 C27.5 42 25 39.5 24.5 34.5 C29 35 31.5 37.5 32 42 Z" fill="#C7A568"/>
  <!-- Grain pairs (right, mirrored) -->
  <path d="M32 31 C36.5 31 39 28.5 39.5 23.5 C35 24 32.5 26.5 32 31 Z" fill="#C7A568"/>
  <path d="M32 36.5 C36.5 36.5 39 34 39.5 29 C35 29.5 32.5 32 32 36.5 Z" fill="#C7A568"/>
  <path d="M32 42 C36.5 42 39 39.5 39.5 34.5 C35 35 32.5 37.5 32 42 Z" fill="#C7A568"/>
  <!-- Terminal grain (highlight) -->
  <path d="M32 15.5 C29.8 18.5 29.8 22 32 25 C34.2 22 34.2 18.5 32 15.5 Z" fill="#E6D3A8"/>
  <!-- Field furrows -->
  <path d="M21 49.5 H43" fill="none" stroke="#C7A568" stroke-opacity="0.55" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M25 52.5 H39" fill="none" stroke="#C7A568" stroke-opacity="0.35" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Outer gold ring -->
  <circle cx="32" cy="32" r="29.5" fill="none" stroke="#C7A568" stroke-width="2"/>
  <!-- Crest diamond -->
  <rect x="29.2" y="-0.3" width="5.6" height="5.6" transform="rotate(45 32 2.5)" fill="#C7A568"/>
</svg>
